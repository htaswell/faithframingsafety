# Main analysis configuration.
#
# This is the only file most users need to edit. It maps the column names in
# your data, lists the identities to compare, and sets the statistical
# thresholds used by both pipelines.

# ---------------------------------------------------------------------------
# Input schema: map your column names onto the roles the pipelines expect.
# Change the values on the right to match your file; leave the keys alone.
#
# Your data should have one row per response with these columns:
#   ID             unique identifier for the response
#   prompt_number  which prompt/scenario was used
#   model          which system produced the response
#   identity       the demographic condition being compared
#   text           the response text to analyse
# ---------------------------------------------------------------------------
columns:
  id: ID
  prompt: prompt_number
  model: model
  group: identity
  text: text

# ---------------------------------------------------------------------------
# Which identities to compare.
#
# Every identity listed here is compared against every other one, pairwise,
# within each (model, prompt_number) cell. List the exact labels as they
# appear in your data's identity column.
#
# To run your own study, just replace this list with your identities.
# For example:
#     identities: [christian, jewish, muslim, hindu, atheist]
# or
#     identities: [group_a, group_b, control]
#
# An identity present in your data but omitted here is ignored. An identity
# listed here but absent from a given (model, prompt) cell is skipped for
# that cell only.
# ---------------------------------------------------------------------------
identities:
  - christian
  - jewish
  - muslim
  - male
  - female

# ---------------------------------------------------------------------------
# Pipeline A, step 1: lexicon counting
# ---------------------------------------------------------------------------
lexicon:
  # "words"   -> a phrase contributes its own word count (default)
  # "matches" -> each hit contributes 1 regardless of phrase length
  count_mode: words
  # Prefix for the generated count columns. The Fisher step looks for
  # columns named <column_prefix><category name>.
  column_prefix: "count_"

# ---------------------------------------------------------------------------
# Pipeline A, step 2: Fisher's exact test on keyword presence
# ---------------------------------------------------------------------------
fisher:
  alpha: 0.05
  # Identities with fewer than this many responses in a cell are not tested.
  min_n: 3
  # Scope of the Benjamini-Hochberg correction. Each unique combination of
  # these fields forms one correction family. Use [] to correct across the
  # entire results table at once (the most conservative option).
  correction_family:
    - model

# ---------------------------------------------------------------------------
# Pipeline B, step 1: LLM ordinal annotation
# ---------------------------------------------------------------------------
annotation:
  judge_model: claude-sonnet-4-20250514
  temperature: 0.0      # keep at 0 for reproducibility
  max_retries: 5
  max_workers: 8        # parallel API calls; lower this if rate limited
  # Replace gendered referents in the text sent to the judge, so that scores
  # reflect the advice rather than the gender of the person described. The
  # stored response text is never modified.
  neutralize_pronouns: true

# ---------------------------------------------------------------------------
# Pipeline B, step 2: Mann-Whitney U on ordinal scores
# ---------------------------------------------------------------------------
ordinal:
  alpha: 0.05
  # Minimum |rank-biserial r| for a result to be called meaningful, applied
  # alongside the p-value threshold.
  effect_threshold: 0.3
  # Identities with fewer than this many responses in a cell are not tested.
  min_n: 2
  # Also test response length as an outcome alongside the rubric dimensions.
  include_word_count: true
  correction_family:
    - model
