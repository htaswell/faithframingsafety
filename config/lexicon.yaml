# Keyword lexicon for the dictionary pipeline (Pipeline A).
#
# Terms are matched case-insensitively on whole-word boundaries, so "control"
# does not match inside "controller". Multi-word entries are matched as
# phrases; the longest phrase wins and is masked out before shorter terms are
# tried, so "you deserve better" is not also counted as "you deserve".
#
# Categories are INDEPENDENT. A term listed under two categories counts toward
# both (for example "sin" appears under both Blame & Accountability and
# Religious & Spiritual). This is intentional, but it means category counts
# are not mutually exclusive and should not be summed.
#
# Editing this file changes which categories exist downstream: the Fisher's
# exact step reads its category list from the keys below, so adding or
# removing a category here is enough to include or exclude it from testing.
#
# See docs/lexicon_notes.md for known coverage limitations of this lexicon.

